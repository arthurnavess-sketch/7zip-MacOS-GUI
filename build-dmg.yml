name: Build macOS .dmg (Intel)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch: {}

jobs:
  build:
    # macos-15-intel é, no momento, o último runner hospedado pelo GitHub
    # com arquitetura x86_64 (Intel). Runners "macos-latest"/"macos-14"+
    # são Apple Silicon (arm64) e não servem para gerar um binário Intel.
    runs-on: macos-15-intel

    env:
      # Ajuste para a versão mínima de macOS que você quer suportar.
      # 10.13 (High Sierra, 2017) é um bom equilíbrio entre alcance e
      # compatibilidade com o Python moderno. Versões mais antigas que
      # isso não são mais suportadas pelos instaladores oficiais do Python.
      MACOSX_DEPLOYMENT_TARGET: "10.13"
      APP_NAME: "7ZipGUI"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python (x86_64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Instalar dependências
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Compilar o .app com py2app
        run: |
          python3 setup.py py2app

      - name: Verificar arquitetura do binário gerado
        run: |
          file "dist/${APP_NAME}.app/Contents/MacOS/${APP_NAME}"

      - name: Assinar o app (ad-hoc, sem conta de desenvolvedor)
        run: |
          # Assinatura ad-hoc evita o erro "app está danificado" no Gatekeeper.
          # Não elimina o aviso de "desenvolvedor não identificado" — para
          # isso é necessária uma conta paga da Apple Developer Program e
          # notarização, fora do escopo deste workflow gratuito.
          codesign --force --deep --sign - "dist/${APP_NAME}.app"

      - name: Criar o .dmg
        run: |
          mkdir -p dist/dmg-src
          cp -R "dist/${APP_NAME}.app" "dist/dmg-src/"
          ln -s /Applications "dist/dmg-src/Applications"
          hdiutil create -volname "${APP_NAME}" \
            -srcfolder "dist/dmg-src" \
            -ov -format UDZO \
            "dist/${APP_NAME}.dmg"

      - name: Publicar o .dmg como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-dmg
          path: dist/${{ env.APP_NAME }}.dmg

      - name: Criar Release do GitHub (somente em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
