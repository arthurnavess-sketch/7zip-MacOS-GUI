name: Build macOS .dmg (Intel)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch: {}

jobs:
  build:
    # macos-15-intel é, no momento, o último runner hospedado pelo GitHub
    # com arquitetura x86_64 (Intel). Runners "macos-latest"/"macos-14"+
    # são Apple Silicon (arm64) e não servem para gerar um binário Intel.
    runs-on: macos-15-intel

    env:
      APP_NAME: "7ZipGUI"
      MACOSX_DEPLOYMENT_TARGET: "10.13"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Confirmar qual versão do workflow está rodando
        run: |
          echo "Commit: ${GITHUB_SHA}"
          echo "Arquivos do repositório:"
          ls -la

      - name: Configurar Python (x86_64)
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Instalar dependências
        env:
          PYTHON: ${{ steps.setup_python.outputs.python-path }}
        run: |
          set -euxo pipefail
          # Usa SEMPRE o interpretador exato do setup-python. O comando
          # "python3" pode apontar para outro Python instalado no runner,
          # fazendo o pip instalar num lugar e o build procurar em outro.
          echo "Interpretador usado: $PYTHON"
          "$PYTHON" --version
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install -r requirements.txt
          # Garante o PyInstaller mesmo que o requirements.txt esteja
          # desatualizado no repositório.
          "$PYTHON" -m pip install "pyinstaller>=6.10"
          "$PYTHON" -m pip list

      - name: Testar as dependências antes de empacotar
        env:
          PYTHON: ${{ steps.setup_python.outputs.python-path }}
        run: |
          set -euxo pipefail
          "$PYTHON" -c "import py7zr; print('py7zr', py7zr.__version__)"
          "$PYTHON" -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"

      - name: Compilar o .app com PyInstaller
        env:
          PYTHON: ${{ steps.setup_python.outputs.python-path }}
        run: |
          set -euxo pipefail
          "$PYTHON" -m PyInstaller "${APP_NAME}.spec" --noconfirm --clean

      - name: Inspecionar o resultado do build
        run: |
          set -euxo pipefail
          echo "=== Conteúdo de dist/ ==="
          ls -la dist/
          echo "=== Bundles .app encontrados ==="
          find dist -maxdepth 1 -name '*.app' -print

      - name: Verificar o bundle e a arquitetura
        run: |
          set -euo pipefail
          APP_PATH="dist/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERRO: $APP_PATH não existe. Conteúdo de dist/:"
            ls -la dist/ || true
            exit 1
          fi
          BIN="$APP_PATH/Contents/MacOS/${APP_NAME}"
          if [ ! -f "$BIN" ]; then
            echo "ERRO: executável não encontrado em $BIN. Conteúdo:"
            ls -la "$APP_PATH/Contents/MacOS/" || true
            exit 1
          fi
          file "$BIN"
          lipo -info "$BIN" || true

      - name: Assinar o app (ad-hoc, sem conta de desenvolvedor)
        run: |
          set -euxo pipefail
          # Assinatura ad-hoc evita o erro "app está danificado" no Gatekeeper.
          # Não elimina o aviso de "desenvolvedor não identificado" — isso
          # exigiria conta paga da Apple Developer Program e notarização.
          codesign --force --deep --sign - "dist/${APP_NAME}.app"
          codesign --verify --verbose "dist/${APP_NAME}.app" || true

      - name: Criar o .dmg
        run: |
          set -euxo pipefail
          rm -rf dist/dmg-src
          mkdir -p dist/dmg-src
          cp -R "dist/${APP_NAME}.app" "dist/dmg-src/"
          ln -s /Applications "dist/dmg-src/Applications"
          hdiutil create -volname "${APP_NAME}" \
            -srcfolder "dist/dmg-src" \
            -ov -format UDZO \
            "dist/${APP_NAME}.dmg"
          ls -lh "dist/${APP_NAME}.dmg"

      - name: Publicar o .dmg como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-dmg
          path: dist/${{ env.APP_NAME }}.dmg

      - name: Publicar logs de diagnóstico se algo falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-build
          path: |
            build/
            dist/
          retention-days: 3
          if-no-files-found: ignore

      - name: Criar Release do GitHub (somente em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
